name: Docker Build and Push

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Dieser Schritt ermittelt den exakten Quell-Branch und macht ihn Docker-konform
      - name: Extract branch name
        id: extract_branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_NAME="$HEAD_REF"
          else
            BRANCH_NAME="$REF_NAME"
          fi
          # Replace / and other special characters with - (important for feature/xyz branches)
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "branch=$CLEAN_BRANCH" >> $GITHUB_OUTPUT

      - name: Extract version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version =' rust-backend/Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            # Liest die Version direkt aus der Cargo.toml, wenn auf main gepusht wird
            type=raw,value=${{ steps.cargo_version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            # Nutzt immer den oben extrahierten Branch-Namen als Tag
            type=raw,value=${{ steps.extract_branch.outputs.branch }}
            # Optional: Immer noch den kurzen SHA-Tag mitgeben (gute Praxis)
            type=sha,format=short
            # Vergibt den Tag 'latest' exklusiv bei Pushes in den main-Branch oder bei Releases
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push on every push. For PRs, only build by default.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

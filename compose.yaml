services:
  zfs-dashboard:
    image: ghcr.io/zfs-manager/zfs-manager:feature-module-system
    container_name: zfs-dashboard
    restart: unless-stopped
    stop_signal: SIGINT
    privileged: true
    ports:
      - "${ZFS_WEB_PORT:-8080}:3000"
    environment:
      - ZFS_API_PORT=3000
      - RUST_LOG=info
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - REDIS_URL=redis://zfs-dashboard-redis:6379
      - DATABASE_URL=postgres://zfs:${POSTGRES_PASSWORD:-zfs_secret}@zfs-dashboard-postgres:5432/zfs_metrics
      - ZFS_SECRETS_MASTER_KEY=${ZFS_SECRETS_MASTER_KEY:-}
    volumes:
      - /dev:/dev
      - /proc:/proc:ro
      - /sys/module/zfs:/sys/module/zfs:ro
      - /var/lib/zfs:/var/lib/zfs:ro
      # Host data dir bind-mounted to /app inside the container.
      # Host path kept as /home/zfs-manager for upgrade compatibility; the
      # entrypoint migrates any leftover data from the old in-container path.
      - /home/zfs-manager:/app
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      zfs-dashboard-redis:
        condition: service_healthy
      zfs-dashboard-postgres:
        condition: service_healthy
    networks:
      - zfs-dashboard

  zfs-dashboard-postgres:
    image: postgres:16-alpine
    container_name: zfs-dashboard-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=zfs_metrics
      - POSTGRES_USER=zfs
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zfs_secret}
    volumes:
      - /home/zfs-dashboard/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zfs -d zfs_metrics" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - zfs-dashboard

  zfs-dashboard-redis:
    image: redis:7-alpine
    container_name: zfs-dashboard-redis
    restart: unless-stopped
    volumes:
      - /home/zfs-dashboard/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - zfs-dashboard

networks:
  zfs-dashboard:
    name: zfs-dashboard

[package]
name = "zfs-dashboard"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "zfs-dashboard"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
bcrypt = "0.15"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
cron = "0.12"
refinery = { version = "=0.9.2", features = ["tokio-postgres"] }
wasmtime = { version = "=47.0.4", default-features = false, features = ["component-model", "async", "runtime", "cranelift", "parallel-compilation"] }
toml = "=1.1.4"
aes-gcm = "=0.11.0"
base64 = "=0.23.0"
wasmtime-wasi = "=47.0.4"
